<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sail - Scramjet</title>
		<script src="/baremux/index.js"></script>
		<script src="/scram/scramjet.all.js"></script>
		<link
			rel="stylesheet"
			href="/assets/css/colors/default.css"
			id="csslink"
		/>
		<link rel="stylesheet" href="/assets/css/font.css?v=2" />
		<script src="/assets/js/Cola.ui.js?v=20260619a"></script>
		<link rel="stylesheet" href="/assets/icons/css/all-pro.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/eruda/3.4.3/eruda.min.js"></script>
		<script>
			navigator.serviceWorker.register("/sw.js", { scope: "/scramjet/" });
		</script>
	</head>

	<body class="obfuscate">
				<style>
			@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

			:root {
				--browser-controls-height: 98px;
				--browser-bookmarks-height: 38px;
				--browser-toolbar-height: 40px;
				--browser-button-size: 40px;
				--browser-tab-height: 40px;
				--cola-amber: #f59e0b;
				--cola-amber-2: #fbbf24;
				--surface: rgba(255, 255, 255, 0.05);
				--surface-hover: rgba(255, 255, 255, 0.09);
				--glass-border: rgba(255, 255, 255, 0.07);
			}

			* { box-sizing: border-box; }
			html { z-index: 111; font-family: 'Inter', sans-serif; }
			body { background: #0a0a0f; margin: 0; }

			body.bookmarks-collapsed { --browser-bookmarks-height: 0px; }

			iframe.viewframe, iframe.browser-frame {
				height: calc(100vh - var(--browser-controls-height) - var(--browser-bookmarks-height) - 15px);
				width: calc(100vw - 10px);
				background: #0a0a0f !important;
				position: absolute;
				left: calc(50% - 1px);
				transform: translateX(-50%);
				bottom: 7.5px;
				border: none;
				pointer-events: none;
				opacity: 0;
				border-radius: 14px;
				z-index: 2;
				transition: opacity 0.2s ease;
			}

			iframe.active { opacity: 1; pointer-events: all; }

			.controls {
				height: calc(var(--browser-controls-height) + var(--browser-bookmarks-height));
				background: rgba(10, 10, 15, 0.95);
				backdrop-filter: blur(20px);
				-webkit-backdrop-filter: blur(20px);
				border-bottom: 1px solid rgba(245,158,11,0.1);
				box-shadow: 0 4px 32px rgba(0,0,0,0.6);
				width: 100vw;
				position: fixed;
				left: 0;
				top: 0;
				padding: 5px;
				transition: height 0.2s ease;
			}

			.tabs {
				position: absolute;
				left: 0;
				top: 2.5px;
				padding: 4px 10px;
				width: 100%;
				height: 44px;
				display: flex;
				gap: 6px;
				align-items: center;
			}

			.tab {
				background: var(--surface);
				border: 1px solid var(--glass-border);
				width: 200px;
				height: var(--browser-tab-height);
				border-radius: 12px;
				padding: 6px 12px;
				color: rgba(255,255,255,0.6);
				display: flex;
				align-items: center;
				overflow: hidden;
				white-space: nowrap;
				cursor: default;
				transition: 0.2s;
				font-size: 13px;
				font-weight: 500;
			}

			.tab.active {
				background: rgba(245,158,11,0.12);
				border-color: rgba(245,158,11,0.35);
				color: #fbbf24;
			}

			.tab:hover {
				background: var(--surface-hover);
				border-color: rgba(255,255,255,0.12);
				color: white;
			}

			.closetab {
				position: absolute;
				right: 10px;
				cursor: pointer;
				font-size: 12px;
				opacity: 0.4;
				transition: opacity 0.15s;
			}
			.closetab:hover { opacity: 1; }

			.tab span {
				font-weight: 500;
				overflow: hidden;
				width: 100%;
				mask-image: linear-gradient(to right, white 60%, transparent 90%);
			}

			.tab img { width: 16px; height: 16px; margin-right: 8px; border-radius: 3px; flex-shrink: 0; }

			.toolbar {
				position: absolute;
				top: 52px;
				left: 0;
				align-items: center;
				justify-content: center;
				height: var(--browser-toolbar-height);
				display: flex;
				width: 100%;
				gap: 6px;
				padding: 0 10px;
			}

			#bar {
				flex: 1;
				border-radius: 12px;
				border: 1px solid var(--glass-border);
				background: var(--surface);
				padding: 0 16px;
				outline: none;
				color: rgba(255,255,255,0.9);
				font-size: 14px;
				font-family: 'Inter', sans-serif;
				transition: 0.2s;
				height: var(--browser-toolbar-height);
				caret-color: #f59e0b;
			}
			#bar::placeholder { color: rgba(255,255,255,0.25); }
			#bar:focus {
				background: rgba(245,158,11,0.06);
				border-color: rgba(245,158,11,0.5);
				box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
				color: white;
			}

			.toolbar button, #newtab {
				width: var(--browser-button-size);
				height: var(--browser-button-size);
				border-radius: 12px;
				border: 1px solid var(--glass-border);
				background: var(--surface);
				color: rgba(255,255,255,0.55);
				transition: 0.2s;
				cursor: pointer;
				font-size: 14px;
				flex-shrink: 0;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.toolbar button:hover, #newtab:hover {
				background: rgba(245,158,11,0.12);
				border-color: rgba(245,158,11,0.35);
				color: #fbbf24;
				box-shadow: 0 0 12px rgba(245,158,11,0.15);
			}

			.bookmarks {
				display: flex;
				flex-direction: row;
				width: 100%;
				height: var(--browser-bookmarks-height);
				padding: 0 10px;
				position: absolute;
				top: 94px;
				gap: 5px;
				overflow: hidden;
				opacity: 1;
				align-items: center;
				transition: height 0.2s ease, opacity 0.2s ease, padding 0.2s ease;
			}
			body.bookmarks-collapsed .bookmarks {
				padding-top: 0; padding-bottom: 0;
				opacity: 0; pointer-events: none;
			}

			.bookmark {
				border-radius: 100px;
				height: 28px;
				padding: 0 12px;
				font-size: 12px;
				background: var(--surface);
				border: 1px solid var(--glass-border);
				display: flex;
				align-items: center;
				gap: 6px;
				cursor: pointer;
				transition: 0.2s;
				white-space: nowrap;
				color: rgba(255,255,255,0.55);
				font-weight: 500;
			}
			.bookmark:hover {
				background: rgba(245,158,11,0.1);
				border-color: rgba(245,158,11,0.3);
				color: #fbbf24;
			}
			.bookmark img { height: 14px; width: 14px; border-radius: 2px; }
			.bookmark span { color: inherit; font-size: 12px; }

			#toggle-bookmarks.collapsed i { transform: rotate(180deg); }
			#toggle-bookmarks i { transition: transform 0.2s ease; }
		</style>

		<div class="controls">
			<div class="tabs">
				<button id="newtab" onclick="newTab()">
					<i class="far fa-plus"></i>
				</button>
			</div>
			<div class="toolbar">
				<button onclick="back()">
					<i class="far fa-arrow-left"></i>
				</button>
				<button onclick="forward()">
					<i class="far fa-arrow-right"></i>
				</button>
				<button onclick="refresh()">
					<i class="far fa-rotate"></i>
				</button>
				<input
					class="obfuscate"
					type="text"
					placeholder="Search for something or enter a URL here..."
					id="bar"
				/>
				<button onclick="popout()">
					<i class="far fa-external-link"></i>
				</button>
				<button onclick="fullscreen()">
					<i class="far fa-expand"></i>
				</button>
				<button onclick="doEruda()">
					<i class="far fa-square-code"></i>
				</button>
				<button id="toggle-bookmarks" title="Toggle bookmarks bar">
					<i class="far fa-chevron-up"></i>
				</button>
			</div>
			<div class="bookmarks" style="margin-top: 2px;">
				<div class="bookmark" onclick="BookmarkManager.addBookmark()">
					<i class="fas fa-plus" style="color: white"></i>
					<span>New Bookmark</span>
				</div>
			</div>
		</div>
		<div id="browserframecontainer"></div>
		<script src="/assets/js/Cola.data.js"></script>
		<script src="/assets/js/Cola.browse.js"></script>
		<script>
			const params = new URLSearchParams(window.location.search);
			if (params.has("url")) {
				(async function () {
					await connection.setTransport("/libcurl/index.mjs", [
						{
							websocket:
								`${window.location.protocol === "https:" ? "wss://" : "ws://"}${window.location.host}/socket/`
						},
					]);
					nav(params.get("url"));
				})();
			}
		</script>
		<script>
			document.getElementById("csslink").href =
				`/assets/css/colors/${localStorage.getItem("Cola_theme") ?? "default"}.css`;
		</script>
		<script>
			function doEruda() {
				const frame = document.querySelector(
					`.viewframe[data-frame-id="${activeTab}"]`,
				);
				const frameWindow = frame.contentWindow;
				const frameDocument = frame.contentDocument || frameWindow.document;
				const script = frameDocument.createElement("script");
				script.src = "https://cdn.jsdelivr.net/npm/eruda";
				script.onload = () => {
					frameWindow.eruda.init();
				};
				frameDocument.head.appendChild(script);
			}
		</script>

		<script src="/assets/js/Cola.ads.js"></script>
		<script src="/assets/js/cola.sidebar.js"></script>
		
	</body>
</html>
