<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cola AI</title>
    <link rel="shortcut icon" href="/assets/img/fav.png" type="image/x-icon" />
    <link rel="stylesheet" href="/assets/css/colors/default.css" id="csslink" />
    <link rel="stylesheet" href="/assets/css/font.css?v=2" />
    <link rel="stylesheet" href="/assets/css/animations.css" />
    <link rel="stylesheet" href="/assets/icons/css/all-pro.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sb: 64px; /* left icon strip width */
            --sidebar-w: 260px; /* left sidebar width */
            --bar-h: 56px; /* top chrome height */
            --amber: #f59e0b;
            --amber-bright: #fbbf24;
            --glass: rgba(9, 9, 14, 0.98);
            --border: rgba(255,255,255,0.06);
            --surf: rgba(255,255,255,0.03);
            --surf-2: rgba(255,255,255,0.02);
            --muted: rgba(255,255,255,0.35);
            --accent-strong: rgba(245,158,11,0.95);
        }

        html, body {
            width:100%; height:100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0b0b0d;
            color: rgba(255,255,255,0.92);
            overflow: hidden;
        }

        /* Left icon strip sits at 0, sidebar pinned to right of it */
        body { margin-left: var(--sb) !important; }

        /* CHROME BAR (matches browse/home) */
        #chrome {
            position: fixed; top: 0; left: var(--sb); width: calc(100vw - var(--sb)); z-index:220;
            background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
            border-bottom: 1px solid rgba(255,255,255,0.02);
            box-shadow: 0 6px 30px rgba(0,0,0,0.6);
            display:flex; flex-direction:column;
        }
        #tab-row { height: var(--bar-h); display:flex; align-items:flex-end; padding:8px 8px 0; gap:6px; overflow-x:auto; }
        #tab-row .tab { display:flex; align-items:center; gap:8px; height:36px; padding:0 12px; border-radius:10px 10px 0 0; border:1px solid var(--border); background:transparent; color:rgba(255,255,255,0.7); font-size:13px; font-weight:600; }
        #tab-row .tab.active { background: linear-gradient(90deg, rgba(245,158,11,0.06), rgba(245,158,11,0.03)); border-color: rgba(245,158,11,0.14); color: var(--amber-bright); box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
        #toolbar-row { height:46px; display:flex; align-items:center; padding:0 8px; gap:12px; border-top:1px solid var(--border); }

        /* ensure main content sits below chrome */
        .ai-main { margin-top: var(--bar-h); }

        /* Left icon strip */
        #leftbar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sb); background: #060607; z-index:230; display:flex; align-items:flex-start; padding-top:8px; border-right: 1px solid rgba(255,255,255,0.02); }
        #leftbar .leftbar-inner { display:flex; flex-direction:column; gap:14px; width:100%; align-items:center; }
        #leftbar .lb-item { width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.6); cursor:pointer; border-radius:8px; }
        #leftbar .lb-item.active { background: rgba(255,255,255,0.02); color:var(--amber-bright); }

        /* Sidebar pinned to right of left strip */
        .ai-sidebar { position: fixed; left: var(--sb); top: var(--bar-h); width: var(--sidebar-w); height: calc(100vh - var(--bar-h)); background: rgba(255,255,255,0.02); border-right: 1px solid rgba(255,255,255,0.02); padding:18px; box-sizing:border-box; z-index:210; overflow-y:auto; }
        .ai-sidebar-header { font-weight:700; color:rgba(255,255,255,0.9); margin-bottom:12px; }

        /* MAIN area sits to right of sidebar */
        .ai-main { margin-left: calc(var(--sb) + var(--sidebar-w)); }

        /* Centered content container */
        .chat-container { padding: 28px 24px; max-width: 1100px; margin: 0 auto; }

        /* Hero / starter grid */
        .hero { text-align:center; }
        .starter-grid { display:grid; grid-template-columns: repeat(2, minmax(240px,1fr)); gap:12px; justify-items:center; margin-top:12px; }
        .starter-grid .starter-btn { width:100%; padding:12px 14px; border-radius:12px; background:transparent; border:1px solid rgba(255,255,255,0.04); color:rgba(255,255,255,0.9); font-weight:600; cursor:pointer; transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease; }
        .starter-grid .starter-btn:hover { transform: translateY(-3px); background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005)); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }

        /* Messages area */
        #messagesContainer { max-width:1100px; margin: 10px auto; height: calc(100vh - var(--bar-h) - 160px); overflow-y:auto; padding: 20px; box-sizing:border-box; }
        .messages .message { margin-bottom:18px; }

        /* Input bar centered and responsive */
        .input-area { position:fixed; left: calc(var(--sb) + var(--sidebar-w) + 24px); right: 40px; bottom: 24px; z-index:240; display:flex; justify-content:center; }
        .input-area .input-wrapper { width:100%; max-width:1100px; display:flex; gap:12px; align-items:center; }
        .input-area .input-field { flex:1; padding:12px 14px; border-radius:28px; background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005)); border:1px solid rgba(255,255,255,0.03); color:rgba(255,255,255,0.9); min-height:44px; max-height:120px; resize:none; outline:none; }
        .send-btn { width:54px; height:54px; border-radius:12px; background: linear-gradient(90deg,var(--amber),var(--amber-bright)); color:#000; border:none; display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 12px 30px rgba(245,158,11,0.12); cursor:pointer; }

        /* Code blocks and markdown */
        .code-block { position: relative; margin: 12px 0; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.02); }
        .code-block pre { margin: 0; padding: 14px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Courier New', monospace; font-size: 13px; color: #e6eef8; background: transparent; }
        .copy-btn { position: absolute; right: 8px; top: 8px; z-index: 10; background: rgba(0,0,0,0.45); color: #fff; border: 1px solid rgba(255,255,255,0.06); padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; }

        /* Responsive tweaks */
        @media (max-width: 900px) { .starter-grid { grid-template-columns: 1fr; } .ai-sidebar { width: 220px; } .ai-main { margin-left: calc(var(--sb) + 220px); } .input-area { left: calc(var(--sb) + 220px + 12px); right:12px; } }

        /* small visual polish */
        .example-card, .new-chat-btn { transition: all 0.16s ease; }

        /* preserve other rules below */

        /* SIDEBAR */
        /* Sidebar styled as a fixed panel to the right of the left icon strip */
        .ai-sidebar {
            position: fixed;
            left: var(--sb);
            top: var(--bar-h);
            width: 260px;
            height: calc(100vh - var(--bar-h));
            background: #131313;
            border-right: 1px solid rgba(255,255,255,0.03);
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
            z-index: 150;
        }

        /* Left icon strip */
        #leftbar {
            position: fixed; left: 0; top: 0; bottom: 0; width: var(--sb); background: #060607; z-index: 300; display:flex; align-items:flex-start; padding-top: 6px; border-right: 1px solid rgba(255,255,255,0.02);
        }
        #leftbar .leftbar-inner { display:flex; flex-direction:column; gap:12px; width:100%; align-items:center; }
        #leftbar .lb-item { width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.6); cursor:pointer; border-radius:8px; }
        #leftbar .lb-item.active { background: rgba(255,255,255,0.03); color:var(--amber-bright); }
        #leftbar .lb-item img { width:20px; height:20px; }

        .ai-sidebar-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 16px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #ecedee;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: #333333;
            border-color: #4a4a4a;
        }

        .search-box {
            width: 100%;
            padding: 10px 12px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #ecedee;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .search-box::placeholder {
            color: #8a8a8a;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .chat-item {
            padding: 12px;
            margin-bottom: 8px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #b4b4b4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-item:hover {
            background: #2a2a2a;
            color: #ecedee;
        }

        .chat-item.active {
            background: #2a5a8a;
            color: #ecedee;
        }

        .chat-item-delete {
            background: none;
            border: none;
            color: #8a8a8a;
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
            display: none;
        }

        .chat-item:hover .chat-item-delete {
            display: block;
        }

        .sidebar-footer {
            padding-top: 12px;
            border-top: 1px solid #2a2a2a;
            font-size: 12px;
            color: #8a8a8a;
        }

        /* MAIN AREA */
        .ai-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0d0d0d 0%, #121212 100%);
            margin-left: calc(var(--sb) + 260px);
            margin-top: var(--bar-h);
        }

        .ai-header {
            padding: 12px 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ai-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .rate-limit-indicator {
            font-size: 12px;
            padding: 6px 12px;
            background: #2a2a2a;
            border-radius: 6px;
            color: #b4b4b4;
        }

        .rate-limit-indicator.critical {
            background: #3d2e2e;
            color: #ff7b7b;
        }

        /* CHAT AREA */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
        }

        .chat-empty {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex: 1;
            gap: 32px;
        }

        .chat-empty h2 {
            font-size: 32px;
            font-weight: 600;
            color: #ecedee;
        }

        .example-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            max-width: 900px;
            width: 100%;
        }

        .example-card {
            padding: 20px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .example-card:hover {
            background: #252525;
            border-color: #3a3a3a;
            transform: translateY(-2px);
        }

        .example-card-icon {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .example-card-title {
            font-weight: 500;
            margin-bottom: 4px;
            color: #ecedee;
        }

        .example-card-desc {
            font-size: 12px;
            color: #8a8a8a;
        }

        /* MESSAGES - updated to match browser/home UI tokens */
        .chat-container { padding: 32px 40px; }
        .messages {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            display: flex;
            gap: 14px;
            animation: fadeInUp 0.28s ease;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 68%;
            padding: 14px 18px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
            white-space: pre-wrap;
            background: var(--surf);
            border: 1px solid var(--border);
            color: rgba(255,255,255,0.92);
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }

        .message.user .message-content {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border-color: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.93);
        }

        .message.ai .message-content {
            background: rgba(255,255,255,0.02);
            border-color: rgba(255,255,255,0.03);
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.02);
        }

        .message.ai .message-avatar {
            background: rgba(255,255,255,0.02);
        }

        .message.user .message-avatar {
            background: linear-gradient(180deg, rgba(58,90,122,0.15), rgba(58,90,122,0.08));
        }

        .typing {
            display: flex;
            gap: 6px;
            padding: 10px 14px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8a8a8a;
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        /* INPUT AREA - harmonize with site chrome */
        .input-area {
            padding: 18px 40px;
            border-top: 1px solid var(--border);
            background: transparent;
            position: sticky; bottom: 0; z-index: 120;
        }

        .input-wrapper { display:flex; gap:12px; align-items:flex-end; }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: rgba(255,255,255,0.92);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            resize: none;
            max-height: 120px;
            min-height: 44px;
        }

        .input-field::placeholder { color: rgba(255,255,255,0.35); }

        .input-field:focus { outline: none; border-color: rgba(245,158,11,0.28); background: rgba(255,255,255,0.02); }
            color: #ecedee;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            resize: none;
            max-height: 120px;
            min-height: 44px;
        }

        .input-field::placeholder {
            color: #8a8a8a;
        }

        .input-field:focus {
            outline: none;
            border-color: #4a4a4a;
            background: #333333;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #8a8a8a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: #333333;
            border-color: #4a4a4a;
            color: #ecedee;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Code block styling */
        .code-block {
            position: relative;
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.03);
        }
        .code-block pre {
            margin: 0; padding: 14px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Courier New', monospace; font-size: 13px; color: #e6eef8; background: transparent;
        }
        .code-block code { white-space: pre-wrap; }
        .copy-btn {
            position: absolute; right: 8px; top: 8px; z-index: 10;
            background: rgba(0,0,0,0.45); color: #fff; border: 1px solid rgba(255,255,255,0.06);
            padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.03); }

        /* Ensure chat area uses site spacing and centers content */
        .chat-container { padding: 24px 40px; max-width: 1100px; margin: 0 auto; }
        .messages { gap: 20px; }

    </style>
</head>

<body>
    <!-- LEFT ICON STRIP (matches browser/home) -->
    <div id="leftbar">
      <div class="leftbar-inner">
        <div class="lb-item active" title="Cola AI"><img src="/assets/img/icons/ai-chatbot.svg" alt="ai"/></div>
        <div class="lb-item" title="Home"><i class="fas fa-home"></i></div>
        <div class="lb-item" title="Browse"><i class="fas fa-compass"></i></div>
        <div class="lb-item" title="Apps"><i class="fas fa-th"></i></div>
        <div class="lb-item" title="Settings"><i class="fas fa-cog"></i></div>
      </div>
    </div>

    <!-- BROWSER CHROME -->
    <div id="chrome">
      <div id="tab-row">
        <div class="tab active">
          <img src="/assets/img/icons/ai-chatbot.svg" alt="ai" />
          <div class="tab-title">Cola AI</div>
        </div>
        <div id="btn-newtab" title="New Chat"><i class="fas fa-plus"></i></div>
      </div>
      <div id="toolbar-row">
        <div style="flex:1"></div>
        <div style="display:flex;align-items:center;gap:12px;padding-right:12px;">
          <select id="apiSourceSelect" title="Choose API source" style="padding:8px;border-radius:8px;background:#171717;border:1px solid rgba(255,255,255,0.04);color:#ecedee;">
            <option value="cola-proxy" selected>Cola AI V1 (Proxy)</option>
            <option value="attachment-key">Onyx AI (Attachment Key)</option>
          </select>
          <select id="modelSelectTop" title="Choose model" style="padding:8px;border-radius:8px;background:#171717;border:1px solid rgba(255,255,255,0.04);color:#ecedee;">
            <option value="gpt-5.4-mini">gpt-5.4-mini</option>
            <option value="gpt-5-mini">gpt-5-mini</option>
            <option value="gpt-4o-mini">gpt-4o-mini</option>
            <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
          </select>
          <div class="rate-limit-indicator" id="rateLimitIndicatorTop" style="background:transparent;border:none;color:#b4b4b4;">5/5 requests available</div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="ai-sidebar">
        <div class="ai-sidebar-header">
            🥤 Cola AI
        </div>
        <button class="new-chat-btn" onclick="newChat()">
            <i class="fas fa-plus"></i>
            New Chat
        </button>
        <input type="text" class="search-box" id="searchBox" placeholder="Search chats..." onkeyup="filterChats()">
        <div class="chat-history" id="chatHistory">
            <!-- Chat history items will be loaded here -->
        </div>
        <div class="sidebar-footer">
            Cola AI v2.0
        </div>
    </aside>

    <!-- MAIN -->
    <main class="ai-main">
        <header class="ai-header" style="display:none;">
            <h1 id="chatTitle">New Chat</h1>
        </header>

        <!-- Hero stage -->
        <div class="ai-stage" style="min-height:calc(100vh - var(--bar-h)); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
            <div style="position:absolute; inset:0; background: radial-gradient(ellipse at center, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.0) 40%); mix-blend-mode: overlay; pointer-events:none;"></div>
            <div class="welcome-wrap" style="width:100%; max-width:1100px;">
                <div class="hero" style="padding:80px 20px 40px; border-radius:12px; display:flex; align-items:center; justify-content:center;">
                    <div style="width:760px; text-align:center; margin:0 auto;">
                        <h2 style="margin:0 0 8px 0; font-size:32px; font-weight:800; color:rgba(255,255,255,0.98); letter-spacing:0.2px;">Welcome to Cola AI</h2>
                        <p style="margin:6px 0 22px 0; color:rgba(255,255,255,0.55);">Ask questions, generate code, or get inspired — powered by Cola AI and Onyx.</p>

                        <div class="starter-grid" style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:8px;">
                            <button class="starter-btn" data-prompt="Write me code that calculates prime numbers in Python" onclick="sendExamplePrompt(this)" style="background:transparent;border:1px solid rgba(255,255,255,0.06); padding:12px 14px; border-radius:10px; color:rgba(255,255,255,0.9); font-weight:600; transition:all 0.18s ease;">Write me code that...</button>
                            <button class="starter-btn" data-prompt="Explain quantum computing in simple terms" onclick="sendExamplePrompt(this)" style="background:transparent;border:1px solid rgba(255,255,255,0.06); padding:12px 14px; border-radius:10px; color:rgba(255,255,255,0.9); font-weight:600; transition:all 0.18s ease;">Explain this in simple terms</button>
                            <button class="starter-btn" data-prompt="Help me brainstorm ideas for a sci-fi short story" onclick="sendExamplePrompt(this)" style="background:transparent;border:1px solid rgba(255,255,255,0.06); padding:12px 14px; border-radius:10px; color:rgba(255,255,255,0.9); font-weight:600; transition:all 0.18s ease;">Help me brainstorm ideas...</button>
                            <button class="starter-btn" data-prompt="What are the pros and cons of using functional programming in large systems?" onclick="sendExamplePrompt(this)" style="background:transparent;border:1px solid rgba(255,255,255,0.06); padding:12px 14px; border-radius:10px; color:rgba(255,255,255,0.9); font-weight:600; transition:all 0.18s ease;">What are the pros and cons of...</button>
                            <button class="starter-btn" data-prompt="Summarize this article for me" onclick="sendExamplePrompt(this)" style="background:transparent;border:1px solid rgba(255,255,255,0.06); padding:12px 14px; border-radius:10px; color:rgba(255,255,255,0.9); font-weight:600; transition:all 0.18s ease;">Summarize this for me</button>
                            <button class="starter-btn" data-prompt="Help me debug this error: [paste error message]" onclick="sendExamplePrompt(this)" style="background:transparent;border:1px solid rgba(255,255,255,0.06); padding:12px 14px; border-radius:10px; color:rgba(255,255,255,0.9); font-weight:600; transition:all 0.18s ease;">Help me debug this error</button>
                            <button class="starter-btn" data-prompt="Write a creative story about a lost robot" onclick="sendExamplePrompt(this)" style="background:transparent;border:1px solid rgba(255,255,255,0.06); padding:12px 14px; border-radius:10px; color:rgba(255,255,255,0.9); font-weight:600; transition:all 0.18s ease;">Write a creative story about...</button>
                            <button class="starter-btn" data-prompt="What's the best way to learn web development?" onclick="sendExamplePrompt(this)" style="background:transparent;border:1px solid rgba(255,255,255,0.06); padding:12px 14px; border-radius:10px; color:rgba(255,255,255,0.9); font-weight:600; transition:all 0.18s ease;">What's the best way to...</button>
                        </div>

                        <div style="margin-top:18px; display:flex; justify-content:center; gap:12px;">
                            <button id="btn-new" class="new-chat-btn" onclick="newChat()" style="background:transparent; border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.9); padding:10px 14px; border-radius:10px;">+ New Chat</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Messages area (hidden until a chat begins) -->
        <div class="messages" id="messagesContainer" style="display:none; padding:24px; max-width:1100px; margin:0 auto;"></div>

        <!-- Input bar pinned to bottom and centered like home UI -->
        <div class="input-area" style="position:fixed; left:calc(var(--sb) + 260px + 20px); right:40px; bottom:24px; z-index:200; display:flex; justify-content:center;">
            <div style="width:100%; max-width:1100px; display:flex; gap:12px; align-items:center;">
                <div style="flex:1; display:flex; align-items:center; gap:12px; background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005)); border:1px solid rgba(255,255,255,0.04); border-radius:28px; padding:10px 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.6);">
                    <i class="fas fa-paperclip" style="color:rgba(255,255,255,0.35);"></i>
                    <textarea class="input-field" id="inputField" placeholder="Message Cola AI..." onkeydown="handleKeyPress(event)" style="background:transparent; border:none; padding:8px; height:44px; min-height:44px; max-height:120px; resize:none;"></textarea>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <select id="miniModelSelect" style="background:transparent; border:1px solid rgba(255,255,255,0.04); color:rgba(255,255,255,0.8); padding:6px 8px; border-radius:8px;">
                            <option value="gpt-5.4-mini">gpt-5.4-mini</option>
                            <option value="gpt-5-mini">gpt-5-mini</option>
                            <option value="gpt-4o-mini">gpt-4o-mini</option>
                        </select>
                    </div>
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send" style="width:54px; height:54px; border-radius:12px; background:linear-gradient(90deg,var(--amber),var(--amber-bright)); color:#000; border:none; box-shadow:0 10px 30px rgba(245,158,11,0.12);"> <i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

    </main>

    <script>
        // AI API - Uses backend proxy at /api/ai/chat (keeps key server-side)
        const GEMINI_API_URL = '/api/ai/chat';

    // Attachment API is routed through server-side proxy at /api/ai/attachment (ATTACHMENT_API_KEY must be configured server-side)

    // RATE LIMITING: 5 requests per 10 minutes
    const RATE_LIMIT_MAX = 5;
    const RATE_LIMIT_WINDOW = 10 * 60 * 1000; // 10 minutes in ms
    const RATE_LIMIT_KEY = 'cola_ai_rate_limit';
    const CHATS_STORAGE_KEY = 'cola_ai_chats';
    const CURRENT_CHAT_KEY = 'cola_ai_current_chat';

        let currentChatId = null;
        let allChats = {};

        function generateChatId() {
            return 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function loadChats() {
            const stored = localStorage.getItem(CHATS_STORAGE_KEY);
            if (stored) {
                allChats = JSON.parse(stored);
            }
            renderChatHistory();
        }

        function saveChats() {
            localStorage.setItem(CHATS_STORAGE_KEY, JSON.stringify(allChats));
        }

        function renderChatHistory() {
            const chatHistory = document.getElementById('chatHistory');
            chatHistory.innerHTML = '';

            const sortedChats = Object.entries(allChats)
                .sort((a, b) => b[1].timestamp - a[1].timestamp);

            if (sortedChats.length === 0) {
                chatHistory.innerHTML = '<div style="text-align: center; color: #8a8a8a; padding: 20px; font-size: 12px;">No chats yet</div>';
                return;
            }

            sortedChats.forEach(([chatId, chat]) => {
                const item = document.createElement('div');
                item.className = 'chat-item' + (chatId === currentChatId ? ' active' : '');
                
                const title = document.createElement('span');
                title.textContent = chat.title || 'Untitled Chat';
                title.style.flex = '1';
                title.style.cursor = 'pointer';
                title.onclick = () => loadChat(chatId);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'chat-item-delete';
                deleteBtn.textContent = '✕';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteChat(chatId);
                };

                item.appendChild(title);
                item.appendChild(deleteBtn);
                chatHistory.appendChild(item);
            });
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            const chat = allChats[chatId];
            
            document.getElementById('chatTitle').textContent = chat.title || 'Chat';
            document.getElementById('messagesContainer').innerHTML = '';
            
            const chatEmpty = document.getElementById('chatEmpty');
            if (chat.messages.length > 0) {
                chatEmpty.style.display = 'none';
            } else {
                chatEmpty.style.display = 'flex';
            }

            chat.messages.forEach(msg => {
                addMessage(msg.text, msg.sender, false);
            });

            localStorage.setItem(CURRENT_CHAT_KEY, chatId);
            renderChatHistory();
        }

        function deleteChat(chatId) {
            if (confirm('Delete this chat?')) {
                delete allChats[chatId];
                saveChats();
                
                if (currentChatId === chatId) {
                    newChat();
                } else {
                    renderChatHistory();
                }
            }
        }

        function filterChats() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const chatHistory = document.getElementById('chatHistory');
            const items = chatHistory.querySelectorAll('.chat-item');
            
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        function getRateLimitData() {
            const stored = localStorage.getItem(RATE_LIMIT_KEY);
            if (!stored) return { requests: [], remaining: RATE_LIMIT_MAX };

            const data = JSON.parse(stored);
            const now = Date.now();

            data.requests = data.requests.filter(timestamp => now - timestamp < RATE_LIMIT_WINDOW);

            return {
                requests: data.requests,
                remaining: RATE_LIMIT_MAX - data.requests.length
            };
        }

        function recordRequest() {
            const data = getRateLimitData();
            data.requests.push(Date.now());
            localStorage.setItem(RATE_LIMIT_KEY, JSON.stringify(data));
            updateRateLimitUI();
        }

        function updateRateLimitUI() {
            const data = getRateLimitData();
            const indicator = document.getElementById('rateLimitIndicator');
            const indicatorTop = document.getElementById('rateLimitIndicatorTop');
            const text = `${data.remaining}/${RATE_LIMIT_MAX} requests available`;

            if (indicator) {
                indicator.textContent = text;
                if (data.remaining === 0) indicator.classList.add('critical'); else indicator.classList.remove('critical');
            }
            if (indicatorTop) {
                indicatorTop.textContent = text;
                if (data.remaining === 0) indicatorTop.classList.add('critical'); else indicatorTop.classList.remove('critical');
            }

            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) sendBtn.disabled = data.remaining === 0;
        }

        function canSendMessage() {
            return getRateLimitData().remaining > 0;
        }

        async function sendMessage() {
            if (!canSendMessage()) {
                alert('Rate limit exceeded. You can send 5 messages per 10 minutes.');
                return;
            }

            const input = document.getElementById('inputField');
            const message = input.value.trim();

            if (!message) return;

            // Remove empty state
            const chatEmpty = document.getElementById('chatEmpty');
            if (chatEmpty) {
                chatEmpty.style.display = 'none';
            }

            // Create chat if needed
            if (!currentChatId) {
                currentChatId = generateChatId();
                allChats[currentChatId] = {
                    id: currentChatId,
                    title: message.substring(0, 30) + (message.length > 30 ? '...' : ''),
                    messages: [],
                    timestamp: Date.now()
                };
            }

            // Add user message
            addMessage(message, 'user', true);
            input.value = '';
            input.style.height = 'auto';

            recordRequest();
            addTypingIndicator();

            try {
            // Choose API source: top toolbar select
            const apiSourceEl = document.getElementById('apiSourceSelect');
                const apiSource = (apiSourceEl && apiSourceEl.value) || 'cola-proxy';
            const modelElTop = document.getElementById('modelSelectTop');
            const chosenModel = (modelElTop && modelElTop.value) || (document.getElementById('miniModelSelect') && document.getElementById('miniModelSelect').value) || 'gpt-5-mini';
            let response;
            if (apiSource === 'cola-proxy') {
                // use server-side proxy that keeps keys secret
                response = await fetch(GEMINI_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: chosenModel,
                        messages: [
                            { role: 'user', content: message }
                        ]
                    })
                });
            } else if (apiSource === 'attachment-key') {
                // Call server-side attachment proxy which uses ATTACHMENT_API_KEY from env
                response = await fetch('/api/ai/attachment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: chosenModel,
                            messages: [
                                { role: 'user', content: message }
                            ]
                        })
                    });
                } else {
                    throw new Error('Unknown API source selected');
                }

                removeTypingIndicator();

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || 'API Error: ' + response.status);
                }

                const data = await response.json();
                const aiResponse = data.content || (data.choices && (data.choices[0]?.message?.content || data.choices[0]?.text)) || data.result || (typeof data === 'string' ? data : JSON.stringify(data)) || 'Sorry, I could not generate a response.';
                
                addMessage(aiResponse, 'ai', true);
            } catch (error) {
                removeTypingIndicator();
                console.error('Error:', error);
                addMessage('Error: ' + (error instanceof Error ? error.message : 'Failed to get response'), 'ai', true);
            }

            saveChats();
            renderChatHistory();
        }

        function addMessage(text, sender, save = true) {
            const container = document.getElementById('messagesContainer');
            const message = document.createElement('div');
            message.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'user' ? '👤' : '🤖';

            const content = document.createElement('div');
            content.className = 'message-content';
            // Render markdown/formatting into HTML
            content.innerHTML = renderMarkdownToHTML(String(text || ''));

            if (sender === 'user') {
                message.appendChild(content);
                message.appendChild(avatar);
            } else {
                message.appendChild(avatar);
                message.appendChild(content);
            }

            container.appendChild(message);
            container.scrollTop = container.scrollHeight;

            // Save message to current chat
            if (save && currentChatId && allChats[currentChatId]) {
                allChats[currentChatId].messages.push({
                    sender: sender,
                    text: text,
                    timestamp: Date.now()
                });
            }
        }

        // Simple markdown renderer to support **bold**, *italic*, inline `code`, lists and fenced code blocks
        window._codeBlocks = window._codeBlocks || [];
        function escapeHTML(str){
            return str.replace(/&/g, '&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function renderMarkdownToHTML(md){
            if(!md) return '';
            // Extract fenced code blocks
            const codeBlocks = [];
            md = md.replace(/```(\w+)?\n([\s\S]*?)```/g, function(_, lang, code){
                const idx = window._codeBlocks.length;
                window._codeBlocks.push(code);
                return `__CODE_BLOCK_${idx}__`;
            });

            // Escape remaining HTML
            md = escapeHTML(md);

            // Replace markdown constructs
            md = md.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            md = md.replace(/\*(.+?)\*/g, '<em>$1</em>');
            md = md.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
            md = md.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');

            // Lists (simple unordered lists starting with - )
            md = md.replace(/(^|\n)(- .+(?:\n- .+)*)/g, function(_, prefix, list){
                const items = list.split('\n').map(l => '<li>' + escapeHTML(l.replace(/^- /,'')) + '</li>').join('');
                return (prefix || '') + '<ul>' + items + '</ul>';
            });

            // Convert double newlines to paragraph breaks, single newline to <br>
            md = md.replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>');
            md = '<p>' + md + '</p>';

            // Restore code blocks placeholders
            md = md.replace(/__CODE_BLOCK_(\d+)__/g, function(_, idx){
                const code = window._codeBlocks[Number(idx)] || '';
                const escaped = escapeHTML(code);
                return `<div class="code-block"><pre><code>${escaped}</code></pre><button class="copy-btn" data-code-index="${idx}">Copy</button></div>`;
            });

            return md;
        }

        // Copy button handler (event delegation)
        document.addEventListener('click', function(e){
            if(e.target && e.target.classList && e.target.classList.contains('copy-btn')){
                const idx = e.target.getAttribute('data-code-index');
                const code = window._codeBlocks[Number(idx)] || '';
                if(navigator.clipboard && code){
                    navigator.clipboard.writeText(code).then(()=>{
                        const prev = e.target.textContent;
                        e.target.textContent = 'Copied';
                        setTimeout(()=> e.target.textContent = prev, 1800);
                    }).catch(()=>{
                        // Fallback: create temporary textarea
                        const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); e.target.textContent = 'Copied'; }catch(err){} t.remove(); setTimeout(()=> e.target.textContent = 'Copy', 1800);
                    });
                }
            }
        });

        function sendExamplePrompt(el) {
            const prompt = (el && (el.dataset && el.dataset.prompt)) || (el && el.textContent) || '';
            const input = document.getElementById('inputField');
                    const messagesEl = document.getElementById('messagesContainer');
                    const stage = document.querySelector('.ai-stage');
                    if (stage) {
                        // animate hero out
                        stage.style.transition = 'opacity 260ms ease, transform 260ms ease';
                        stage.style.opacity = '0';
                        stage.style.transform = 'translateY(-8px)';
                        setTimeout(()=> { stage.style.display = 'none'; }, 300);
                    }
                    if (messagesEl) {
                        messagesEl.style.display = 'block';
                    }
                    if (input) {
                        input.value = prompt.trim();
                        input.focus();
                    }
                }

                function addTypingIndicator() {
            const container = document.getElementById('messagesContainer');
            const message = document.createElement('div');
            message.className = 'message ai';
            message.id = 'typing-indicator';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';

            const content = document.createElement('div');
            content.className = 'typing';
            content.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

            message.appendChild(avatar);
            message.appendChild(content);

            container.appendChild(message);
            container.scrollTop = container.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        function sendExamplePrompt(card) {
            const title = card.querySelector('.example-card-title').textContent;
            document.getElementById('inputField').value = title;
            document.getElementById('inputField').focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
            event.target.style.height = 'auto';
            event.target.style.height = Math.min(event.target.scrollHeight, 120) + 'px';
        }

        function newChat() {
            const lastChatId = localStorage.getItem(CURRENT_CHAT_KEY);
            currentChatId = null;
            document.getElementById('messagesContainer').innerHTML = '';
            document.getElementById('chatEmpty').style.display = 'flex';
            document.getElementById('inputField').value = '';
            document.getElementById('chatTitle').textContent = 'New Chat';
            renderChatHistory();
        }

        // Initialize
        loadChats();
        updateRateLimitUI();
        
        const lastChatId = localStorage.getItem(CURRENT_CHAT_KEY);
        if (lastChatId && allChats[lastChatId]) {
            loadChat(lastChatId);
        }

        setInterval(updateRateLimitUI, 1000);

        // Sync top model select with mini select in the input area
        (function(){
            const modelTop = document.getElementById('modelSelectTop');
            const mini = document.getElementById('miniModelSelect');
            if(modelTop && mini){
                // keep them in sync
                modelTop.addEventListener('change', ()=> { mini.value = modelTop.value; });
                mini.addEventListener('change', ()=> { modelTop.value = mini.value; });
            }
        })();
    </script>
    <script src="/assets/js/cola.sidebar.js"></script>
