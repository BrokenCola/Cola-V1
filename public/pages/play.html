<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cola | Play</title>
    <link rel="shortcut icon" href="/assets/img/fav.png" type="image/x-icon" id="tabIcon">
    <link rel="stylesheet" href="/assets/css/colors/default.css" id="csslink">
    <link rel="stylesheet" href="/assets/css/font.css?v=2">
    <link rel="stylesheet" href="/assets/icons/css/all-pro.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #070710;
            --surface: rgba(12,12,22,0.9);
            --border: rgba(255,255,255,0.07);
            --border-gold: rgba(251,191,36,0.4);
            --gold: #fbbf24;
            --amber: #f59e0b;
            --glow: rgba(251,191,36,0.2);
            --text: #f1f1f3;
            --muted: #9ca3af;
            --sidebar: 64px;
            --green: #4ade80;
            --red: #ef4444;
        }

        *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            background-image: radial-gradient(rgba(251,191,36,0.06) 1px, transparent 1px);
            background-size: 28px 28px;
            color: var(--text);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            overflow: hidden;
        }

        body {
            margin-left: var(--sidebar) !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            transition: margin-left 0.3s cubic-bezier(.4,0,.2,1);
        }

        body.no-sidebar { margin-left: 0 !important; }

        /* ─── GAME WRAPPER ────────────────────────────────── */
        .game-shell {
            width: calc(100vw - var(--sidebar) - 32px);
            height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(0,0,0,0.8), 0 0 0 1px var(--border-gold), 0 0 60px var(--glow);
            transition: width 0.3s cubic-bezier(.4,0,.2,1), height 0.3s ease;
            position: relative;
        }

        body.no-sidebar .game-shell {
            width: calc(100vw - 32px);
        }

        /* Neon top accent bar */
        .game-shell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--amber) 40%, var(--gold) 60%, transparent 100%);
            z-index: 10;
        }

        /* ─── GAME IFRAME ─────────────────────────────────── */
        #gameframe {
            width: 100%;
            flex: 1;
            background: #000;
            border: none;
        }

        /* ─── TOOLBAR ─────────────────────────────────────── */
        .toolbar {
            width: 100%;
            height: 52px;
            flex-shrink: 0;
            background: rgba(10,10,18,0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            gap: 12px;
            position: relative;
        }

        /* Ambient glow beneath toolbar */
        .toolbar::before {
            content:'';
            position:absolute;
            bottom:0; left:0; right:0;
            height:1px;
            background: linear-gradient(90deg, transparent, var(--amber), transparent);
            opacity: 0.4;
        }

        .tb-left, .tb-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Game title section */
        .game-id {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-id img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(251,191,36,0.5));
        }

        .game-id-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .game-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10.5px;
            color: var(--green);
            font-weight: 700;
        }

        .status-led {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

        /* Toolbar buttons */
        .tb-btn {
            height: 36px;
            padding: 0 13px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: rgba(255,255,255,0.8);
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.18s cubic-bezier(.4,0,.2,1);
            white-space: nowrap;
        }

        .tb-btn i { font-size: 12px; }

        .tb-btn:hover {
            background: rgba(251,191,36,0.12);
            border-color: var(--border-gold);
            color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
        }

        .tb-btn.primary {
            background: linear-gradient(135deg, var(--amber), var(--gold));
            border: none;
            color: #000;
            font-weight: 800;
            box-shadow: 0 0 20px var(--glow);
        }

        .tb-btn.primary:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 0 28px rgba(251,191,36,0.5);
        }

        .tb-btn.danger {
            background: rgba(239,68,68,0.12);
            border-color: rgba(239,68,68,0.3);
            color: var(--red);
        }

        .tb-btn.danger:hover {
            background: rgba(239,68,68,0.22);
            border-color: rgba(239,68,68,0.5);
            transform: translateY(-2px);
        }

        .tb-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            flex-shrink: 0;
        }

        /* Volume Slider */
        .vol-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
        }

        .vol-wrap i { font-size: 13px; color: var(--muted); }

        .vol-slider {
            -webkit-appearance: none;
            width: 72px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.15);
            outline: none;
            cursor: pointer;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 8px var(--glow);
            cursor: pointer;
        }

        /* Rec dot */
        .rec-dot { width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1s ease-in-out infinite; }

        /* ─── LOADING OVERLAY ─────────────────────────────── */
        #loadOverlay {
            position: absolute;
            inset: 0;
            background: rgba(7,7,16,0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        #loadOverlay.hidden { opacity:0; pointer-events:none; }

        .load-spinner {
            width: 52px;
            height: 52px;
            border: 3px solid rgba(251,191,36,0.15);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100%{transform:rotate(360deg)} }

        .load-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
        }

        /* ─── ERROR OVERLAY ───────────────────────────────── */
        #errOverlay {
            position: absolute;
            inset: 0;
            background: rgba(7,7,16,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 101;
            text-align: center;
            padding: 32px;
        }

        #errOverlay.show { display:flex; }

        .err-icon { font-size: 48px; color: rgba(239,68,68,0.6); }

        .err-title { font-size: 22px; font-weight: 800; color: var(--text); }
        .err-sub { font-size: 14px; color: var(--muted); max-width: 400px; line-height: 1.6; }

        .err-actions { display:flex; gap:12px; margin-top:8px; }
    </style>
</head>

<body class="obfuscate">

    <div class="game-shell">
        <!-- LOADING OVERLAY -->
        <div id="loadOverlay">
            <div class="load-spinner"></div>
            <div class="load-text" id="loadText">Loading game...</div>
        </div>

        <!-- ERROR OVERLAY -->
        <div id="errOverlay">
            <i class="fas fa-triangle-exclamation err-icon"></i>
            <div class="err-title">Couldn't Load Game</div>
            <div class="err-sub">This game couldn't be loaded. Try reloading, or head back to the library to pick another one.</div>
            <div class="err-actions">
                <button class="tb-btn primary" onclick="reloadGame()"><i class="fas fa-rotate-right"></i> Reload</button>
                <button class="tb-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back to Library</button>
            </div>
        </div>

        <!-- GAME IFRAME -->
        <iframe id="gameframe" frameborder="0" allowfullscreen
            allow="autoplay; fullscreen; pointer-lock; gamepad; camera; microphone; gyroscope; accelerometer"></iframe>

        <!-- CONTROL TOOLBAR -->
        <div class="toolbar">
            <div class="tb-left">
                <div class="game-id">
                    <img src="/assets/img/fav.png" alt="Cola" />
                    <div class="game-id-text">
                        <div class="game-name" id="gameName">Loading...</div>
                        <div class="game-status">
                            <div class="status-led"></div>
                            <span>Unblocked</span>
                        </div>
                    </div>
                </div>

                <div class="tb-divider"></div>

                <!-- SIDEBAR TOGGLE -->
                <button class="tb-btn" id="sidebarBtn" onclick="toggleSidebar()" title="Minimize sidebar for more space">
                    <i class="fas fa-sidebar-flip"></i>
                    <span>Sidebar</span>
                </button>

                <!-- VOLUME -->
                <div class="vol-wrap" title="Game Volume">
                    <i class="fas fa-volume-medium" id="volIcon"></i>
                    <input class="vol-slider" id="volSlider" type="range" min="0" max="1" step="0.02" value="1" oninput="setVolume(this.value)" />
                </div>
            </div>

            <div class="tb-right">
                <!-- FULLSCREEN -->
                <button class="tb-btn primary" onclick="doFullscreen()" title="Fullscreen (F11)">
                    <i class="fas fa-expand"></i>
                    <span>Fullscreen</span>
                </button>

                <div class="tb-divider"></div>

                <!-- RELOAD -->
                <button class="tb-btn" onclick="reloadGame()" title="Reload game">
                    <i class="fas fa-rotate-right"></i>
                </button>

                <!-- POPOUT -->
                <button class="tb-btn" onclick="popOut()" title="Open in new window">
                    <i class="fas fa-external-link"></i>
                </button>

                <!-- SCREENSHOT -->
                <button class="tb-btn" onclick="takeScreenshot()" title="Screenshot">
                    <i class="fas fa-camera"></i>
                </button>

                <!-- RECORD -->
                <button class="tb-btn" id="recBtn" onclick="toggleRecord()" title="Record gameplay">
                    <i class="fas fa-circle-dot"></i>
                    <span id="recLabel">Record</span>
                </button>

                <div class="tb-divider"></div>

                <!-- BACK -->
                <button class="tb-btn" onclick="goBack()" title="Back to Games Library">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const rawLaunch = params.get("launch") || params.get("url") || "";
        const gameframe = document.getElementById("gameframe");
        let sidebarOpen = true;
        let recState = false;
        let mediaRec, recChunks = [];
        let loadTimer;

        /* ── RESOLVE GAME URL ──────────────────────────────── */
        function resolveUrl(raw) {
            const dec = decodeURIComponent(raw).trim();

            // Cloud gaming protocol
            if (dec.startsWith("cloud:")) {
                const key = dec.slice(6);
                return `https://raw.githack.com/x8rr/stratus-api/main/api?game_key=${key}`;
            }

            // Lumin protocol — proxy to Render backend /stores/
            if (dec.startsWith("lumin:")) {
                const id = dec.slice(6);
                return `/stores/lumin/${id}`;
            }

            // Relative /stores/ path — served via Vercel rewrite from Render backend
            if (dec.startsWith("/stores/") || dec.startsWith("stores/")) {
                return dec.startsWith("/") ? dec : "/" + dec;
            }

            // Already a full URL
            if (dec.startsWith("http://") || dec.startsWith("https://")) {
                return dec;
            }

            // Relative path fallback
            return "/" + dec.replace(/^\/+/, "");
        }

        /* ── LOAD GAME ─────────────────────────────────────── */
        function loadGame() {
            if (!rawLaunch) { goBack(); return; }

            const url = resolveUrl(rawLaunch);
            setLoadText("Loading " + extractName(rawLaunch) + "...");
            showLoader(true);

            gameframe.src = url;

            // Timeout fallback — if frame doesn't load in 12s show error
            loadTimer = setTimeout(() => {
                if (document.getElementById("loadOverlay").classList.contains("hidden")) return;
                showLoader(false);
                showError(true);
            }, 12000);
        }

        function extractName(raw) {
            try {
                const dec = decodeURIComponent(raw);
                const parts = dec.split("/");
                const last = parts[parts.length-1].replace(".html","").replace(/[-_]/g," ");
                return last.charAt(0).toUpperCase() + last.slice(1);
            } catch { return "Game"; }
        }

        /* ── OVERLAY HELPERS ───────────────────────────────── */
        function showLoader(show) {
            const el = document.getElementById("loadOverlay");
            if (show) el.classList.remove("hidden");
            else el.classList.add("hidden");
        }

        function showError(show) {
            const el = document.getElementById("errOverlay");
            if (show) el.classList.add("show");
            else el.classList.remove("show");
        }

        function setLoadText(t) {
            document.getElementById("loadText").textContent = t;
        }

        /* ── FRAME EVENTS ──────────────────────────────────── */
        gameframe.addEventListener("load", () => {
            clearTimeout(loadTimer);
            showLoader(false);
            showError(false);

            const name = extractName(rawLaunch);
            document.getElementById("gameName").textContent = name;
            document.title = `Cola | ${name}`;
        });

        gameframe.addEventListener("error", () => {
            clearTimeout(loadTimer);
            showLoader(false);
            showError(true);
        });

        /* ── TOOLBAR ACTIONS ────────────────────────────────── */
        function reloadGame() {
            showError(false);
            showLoader(true);
            setLoadText("Reloading...");
            gameframe.src = gameframe.src;
            loadTimer = setTimeout(() => { showLoader(false); showError(true); }, 12000);
        }

        function goBack() { window.location.href = "/pages/games.html"; }

        function popOut() { window.open(gameframe.src, "_blank"); }

        function doFullscreen() {
            const el = gameframe;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
        }

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            document.body.classList.toggle("no-sidebar", !sidebarOpen);
            const btn = document.getElementById("sidebarBtn");
            if (sidebarOpen) {
                btn.innerHTML = '<i class="fas fa-sidebar-flip"></i> <span>Sidebar</span>';
                btn.classList.remove("primary");
            } else {
                btn.innerHTML = '<i class="fas fa-expand-wide"></i> <span>Expand</span>';
                btn.classList.add("primary");
            }
        }

        function setVolume(v) {
            const icon = document.getElementById("volIcon");
            if (v == 0) icon.className = "fas fa-volume-xmark";
            else if (v < 0.5) icon.className = "fas fa-volume-low";
            else icon.className = "fas fa-volume-medium";

            // Try to set volume on the iframe content (if same origin)
            try {
                const iframeDoc = gameframe.contentDocument || gameframe.contentWindow?.document;
                const audios = iframeDoc?.querySelectorAll("audio, video");
                audios?.forEach(a => a.volume = v);
            } catch (e) {}
        }

        /* ── SCREENSHOT ─────────────────────────────────────── */
        async function takeScreenshot() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const track = stream.getVideoTracks()[0];
                const cap = new ImageCapture(track);
                const blob = await cap.takePhoto();
                track.stop();
                stream.getTracks().forEach(t => t.stop());
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `Cola_Screenshot_${Date.now()}.png`;
                a.click();
                URL.revokeObjectURL(url);
            } catch {
                // Fallback: trigger native screenshot prompt
                alert("Use the Fullscreen button then take a screenshot with your OS shortcut (Win+Shift+S).");
            }
        }

        /* ── RECORDING ──────────────────────────────────────── */
        async function toggleRecord() {
            const btn = document.getElementById("recBtn");
            const lbl = document.getElementById("recLabel");

            if (recState) {
                mediaRec?.stop();
                recState = false;
                btn.classList.remove("danger");
                btn.innerHTML = '<i class="fas fa-circle-dot"></i> <span id="recLabel">Record</span>';
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                recChunks = [];
                mediaRec = new MediaRecorder(stream);
                mediaRec.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
                mediaRec.onstop = () => {
                    const blob = new Blob(recChunks, { type: "video/webm" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url; a.download = `Cola_Gameplay_${Date.now()}.webm`;
                    a.click(); URL.revokeObjectURL(url);
                };
                mediaRec.start();
                recState = true;
                btn.classList.add("danger");
                btn.innerHTML = '<div class="rec-dot"></div> <span id="recLabel">Stop</span>';
            } catch (e) {}
        }

        /* ── KEYBOARD SHORTCUTS ─────────────────────────────── */
        document.addEventListener("keydown", e => {
            if (e.key === "F11") { e.preventDefault(); doFullscreen(); }
            if (e.key === "Escape" && !document.fullscreenElement) goBack();
        });

        /* ── INIT ───────────────────────────────────────────── */
        document.getElementById("csslink").href = `/assets/css/colors/${localStorage.getItem("Cola_theme")??"default"}.css`;
        loadGame();
    </script>

    <script src="/assets/js/cola.sidebar.js"></script>
</body>
</html>
