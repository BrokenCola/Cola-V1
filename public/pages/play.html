<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cola | Play Game</title>
    <link rel="shortcut icon" href="/assets/img/fav.png" type="image/x-icon" id="tabIcon">
    <link rel="stylesheet" href="/assets/css/colors/default.css" id="csslink">
    <link rel="stylesheet" href="/assets/css/font.css?v=2">
    <link rel="stylesheet" href="/assets/icons/css/all-pro.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: rgba(18, 18, 24, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-amber: rgba(245, 158, 11, 0.35);
            --accent-gold: #fbbf24;
            --accent-amber: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.2);
            --sidebar-width: 64px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            color: #f4f4f5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            transition: margin-left 0.25s ease;
        }

        body {
            margin-left: var(--sidebar-width) !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        body.sidebar-collapsed {
            margin-left: 0px !important;
        }

        /* ─── GAME CONTAINER & VIEWPORT ──────────────────── */
        .game-wrapper {
            width: calc(100vw - var(--sidebar-width) - 40px);
            height: calc(100vh - 110px);
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: width 0.25s ease;
        }

        body.sidebar-collapsed .game-wrapper {
            width: calc(100vw - 40px);
        }

        #gameframe {
            width: 100%;
            flex: 1;
            background: #000;
            border: 1px solid var(--border-amber);
            border-radius: 16px 16px 0 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
        }

        /* ─── CONTROL TOOLBAR ────────────────────────────── */
        .game-toolbar {
            width: 100%;
            height: 52px;
            background: rgba(14, 14, 20, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-top: none;
            border-radius: 0 0 16px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .tb-left, .tb-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-title-display {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-title-display img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .tb-btn {
            height: 36px;
            padding: 0 12px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.15s ease;
        }

        .tb-btn:hover {
            background: rgba(245, 158, 11, 0.15);
            border-color: var(--border-amber);
            color: var(--accent-gold);
            transform: translateY(-1px);
        }

        .tb-btn.highlight {
            background: rgba(245, 158, 11, 0.2);
            border-color: var(--border-amber);
            color: var(--accent-gold);
            font-weight: 600;
        }

        .tb-btn.highlight:hover {
            background: var(--accent-amber);
            color: #000;
        }

        .rec-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulseRec 1.2s infinite ease-in-out;
        }
        @keyframes pulseRec { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>

<body class="obfuscate">

    <!-- ─── GAME CONTAINER ──────────────────────────────── -->
    <div class="game-wrapper">
        <iframe id="gameframe" frameborder="0" allowfullscreen allow="autoplay; fullscreen; pointer-lock; gamepad"></iframe>

        <!-- CONTROL TOOLBAR -->
        <div class="game-toolbar">
            <div class="tb-left">
                <div class="game-title-display">
                    <img src="/assets/img/fav.png" alt="Cola" />
                    <span id="gameNameText">Playing Game</span>
                </div>
            </div>

            <div class="tb-right">
                <!-- Minimize Sidebar Toggle -->
                <button class="tb-btn" onclick="toggleSidebarCollapse()" title="Toggle Sidebar (Expand Game Width)" id="toggleSbBtn">
                    <i class="fas fa-arrows-left-right"></i>
                    <span>Minimize Sidebar</span>
                </button>

                <!-- Fullscreen Button -->
                <button class="tb-btn highlight" onclick="fullscreenGame()" title="Fullscreen Game">
                    <i class="fas fa-expand"></i>
                    <span>Fullscreen</span>
                </button>

                <!-- Reload Button -->
                <button class="tb-btn" onclick="refreshGame()" title="Reload Game">
                    <i class="fas fa-rotate-right"></i>
                </button>

                <!-- Popout Button -->
                <button class="tb-btn" onclick="popoutGame()" title="Open in new window">
                    <i class="fas fa-external-link"></i>
                </button>

                <!-- Record Button -->
                <button class="tb-btn" id="recordBtn" onclick="toggleRecording()" title="Record Gameplay">
                    <i class="fas fa-circle-dot"></i>
                    <span id="recBtnText">Record</span>
                </button>

                <!-- Return Home/Games -->
                <button class="tb-btn" onclick="window.location.href='/pages/games.html'" title="Back to Games">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ─── SCRIPTS ───────────────────────────────────── -->
    <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
    <script>
        const gameframe = document.getElementById("gameframe");
        const urlParams = new URLSearchParams(window.location.search);
        const rawLaunch = urlParams.get("launch") || urlParams.get("url");

        // ── SMART DIRECT GAME RESOLVER (INSTANT & NO BLACK SCREEN) ──
        function resolveGameUrl(raw) {
            if (!raw) return "/pages/games.html";

            const decoded = decodeURIComponent(raw).trim();

            // 1. Lumin launch
            if (decoded.startsWith("lumin:")) {
                const gameId = decoded.slice("lumin:".length);
                if (window.Lumin && window.Lumin.getGameUrl) {
                    return window.Lumin.getGameUrl(gameId).then(res => res?.url || `https://main.monochrome-507.pages.dev/stores/lumin/${gameId}`);
                }
                return `https://main.monochrome-507.pages.dev/stores/lumin/${gameId}`;
            }

            // 2. Direct CDN Store Mappings (Zero Proxy Required -> Ultra-Fast Loading)
            if (decoded.startsWith("/stores/gn-math/")) {
                return `https://cdn.jsdelivr.net/gh/gn-math/gn-math.github.io@main${decoded}`;
            }

            if (decoded.startsWith("/stores/ugs/")) {
                return `https://cdn.jsdelivr.net/gh/bubbls/ugs-single-file@main${decoded}`;
            }

            if (decoded.startsWith("/stores/truffled/")) {
                return `https://cdn.jsdelivr.net/gh/truffled-gs/truffled-gs.github.io@main${decoded}`;
            }

            if (decoded.startsWith("/stores/")) {
                return `https://main.monochrome-507.pages.dev${decoded}`;
            }

            // 3. Full HTTP/HTTPS URLs
            if (decoded.startsWith("http://") || decoded.startsWith("https://")) {
                return decoded;
            }

            // 4. Relative fallback
            return decoded;
        }

        async function loadGame() {
            if (!rawLaunch) {
                window.location.href = "/pages/games.html";
                return;
            }

            const targetUrl = await Promise.resolve(resolveGameUrl(rawLaunch));
            gameframe.src = targetUrl;

            // Extract game name for display
            try {
                let name = "Game";
                if (rawLaunch.includes("/stores/")) {
                    const parts = rawLaunch.split("/");
                    name = parts[parts.length - 1].replace(".html", "").toUpperCase();
                } else {
                    const u = new URL(targetUrl, window.location.origin);
                    name = u.hostname.replace(/^www\./, "");
                }
                document.getElementById("gameNameText").textContent = name;
            } catch (e) {}
        }

        function refreshGame() {
            gameframe.src = gameframe.src;
        }

        function popoutGame() {
            window.open(gameframe.src, "_blank");
        }

        function fullscreenGame() {
            if (gameframe.requestFullscreen) {
                gameframe.requestFullscreen();
            } else if (gameframe.webkitRequestFullscreen) {
                gameframe.webkitRequestFullscreen();
            } else if (gameframe.msRequestFullscreen) {
                gameframe.msRequestFullscreen();
            }
        }

        function toggleSidebarCollapse() {
            document.body.classList.toggle("sidebar-collapsed");
            const collapsed = document.body.classList.contains("sidebar-collapsed");
            const btn = document.getElementById("toggleSbBtn");
            if (collapsed) {
                btn.innerHTML = '<i class="fas fa-arrows-left-right"></i> <span>Expand Sidebar</span>';
                btn.classList.add("highlight");
            } else {
                btn.innerHTML = '<i class="fas fa-arrows-left-right"></i> <span>Minimize Sidebar</span>';
                btn.classList.remove("highlight");
            }
        }

        // ── SCREEN RECORDING ─────────────────────────────────
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        async function toggleRecording() {
            const btn = document.getElementById("recordBtn");
            const text = document.getElementById("recBtnText");

            if (isRecording) {
                mediaRecorder?.stop();
                isRecording = false;
                btn.classList.remove("highlight");
                text.textContent = "Record";
                btn.querySelector("i").className = "fas fa-circle-dot";
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: 60 },
                    audio: true
                });

                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = saveRecording;
                mediaRecorder.start();

                isRecording = true;
                btn.classList.add("highlight");
                text.textContent = "Stop Recording";
                btn.innerHTML = '<div class="rec-dot"></div> <span id="recBtnText">Stop Recording</span>';
            } catch (err) {
                console.error("Recording error:", err);
            }
        }

        function saveRecording() {
            const blob = new Blob(recordedChunks, { type: "video/mp4" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Cola_Gameplay_${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        // Theme sync
        document.getElementById("csslink").href = `/assets/css/colors/${localStorage.getItem("Cola_theme") ?? "default"}.css`;

        // Load Game
        loadGame();
    </script>

    <!-- Global Cola Sidebar Injection -->
    <script src="/assets/js/cola.sidebar.js"></script>
</body>

</html>
