<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cola | Games Library</title>
    <link rel="shortcut icon" href="/assets/img/fav.png" type="image/x-icon">
    <link rel="stylesheet" href="/assets/css/font.css?v=4">
    <link rel="stylesheet" href="/assets/css/colors/default.css" id="csslink">
    <link rel="stylesheet" href="/assets/icons/css/all-pro.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #07070a;
            --card-bg: rgba(16, 16, 24, 0.85);
            --card-hover: rgba(26, 26, 38, 0.92);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-amber: rgba(245, 158, 11, 0.4);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --text-dim: #71717a;
            --accent-gold: #fbbf24;
            --accent-amber: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --sidebar-width: 64px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: var(--bg-dark);
            background-image: radial-gradient(rgba(245, 158, 11, 0.06) 1px, transparent 1px);
            background-size: 28px 28px;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }

        body {
            margin-left: var(--sidebar-width) !important;
            padding: 28px 40px 60px;
        }

        /* ─── PAGE HEADER & HERO SHOWCASE ─────────────────── */
        .games-header {
            max-width: 1400px;
            margin: 0 auto 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title-wrap img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(245,158,11,0.5));
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-badge {
            font-size: 12px;
            font-weight: 700;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--border-amber);
            color: var(--accent-gold);
            padding: 5px 12px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* HERO SHOWCASE CARD */
        .hero-banner {
            width: 100%;
            height: 220px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(245,158,11,0.2) 0%, rgba(16,16,24,0.9) 60%), url('/assets/img/g/gn-math/0.png');
            background-size: cover;
            background-position: center;
            border: 1px solid var(--border-amber);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 25px var(--accent-glow);
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(9,9,11,0.95) 30%, rgba(9,9,11,0.4) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hero-tag {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hero-game-title {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .hero-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .btn-play-hero {
            margin-top: 6px;
            width: fit-content;
            padding: 10px 22px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-amber) 0%, var(--accent-gold) 100%);
            border: none;
            color: #000;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(245,158,11,0.4);
            text-decoration: none;
        }

        .btn-play-hero:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 24px rgba(245,158,11,0.6);
        }

        /* ─── CONTROLS BAR ────────────────────────────────── */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            background: rgba(14, 14, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 12px 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .search-input-wrap {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .search-input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 14px;
        }

        .games-search-input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 13.5px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .games-search-input::placeholder {
            color: var(--text-dim);
        }

        .games-search-input:focus {
            border-color: var(--border-amber);
            background: rgba(245, 158, 11, 0.06);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .provider-select {
            padding: 11px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .provider-select:hover, .provider-select:focus {
            border-color: var(--border-amber);
            background: rgba(245, 158, 11, 0.08);
            color: var(--accent-gold);
        }

        .provider-select option {
            background: #121218;
            color: #fff;
        }

        /* ─── CATEGORY PILLS ─────────────────────────────── */
        .category-pills {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .category-pills::-webkit-scrollbar { display: none; }

        .pill-btn {
            padding: 7px 16px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s ease;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .pill-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .pill-btn.active {
            background: rgba(245, 158, 11, 0.18);
            border-color: var(--border-amber);
            color: var(--accent-gold);
            box-shadow: 0 0 14px var(--accent-glow);
        }

        /* ─── MAIN CONTAINER & SECTIONS ──────────────────── */
        .games-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* ─── GAMES GRID & CARDS (POP EFFECT) ─────────────── */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .game-card:hover {
            background: var(--card-hover);
            border-color: var(--border-amber);
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6), 0 0 24px var(--accent-glow);
        }

        .card-img-wrap {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #101018;
            overflow: hidden;
            position: relative;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .game-card:hover .card-img-wrap img {
            transform: scale(1.08);
        }

        /* Play Overlay Button popping up on hover */
        .card-play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 9, 14, 0.6);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .game-card:hover .card-play-overlay {
            opacity: 1;
        }

        .play-btn-pop {
            padding: 8px 16px;
            border-radius: 100px;
            background: linear-gradient(135deg, var(--accent-amber), var(--accent-gold));
            color: #000;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }

        .game-card:hover .play-btn-pop {
            transform: scale(1);
        }

        .card-fav-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.18s ease;
            z-index: 3;
        }

        .card-fav-btn:hover {
            color: var(--accent-gold);
            background: rgba(10, 10, 15, 0.95);
            transform: scale(1.1);
        }

        .card-fav-btn.active {
            color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.25);
            border-color: var(--border-amber);
        }

        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--text-dim);
        }

        .card-tag {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .loading-state, .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            gap: 14px;
            color: var(--text-muted);
        }

        .loading-spinner {
            font-size: 32px;
            color: var(--accent-gold);
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>

<body class="obfuscate">

    <!-- ─── PAGE HEADER & HERO SHOWCASE ─────────────────── -->
    <header class="games-header">
        <div class="header-top">
            <div class="header-title-wrap">
                <img src="/assets/img/fav.png" alt="Cola Games" />
                <h1 class="header-title">Games Hub</h1>
                <span class="header-badge" id="totalGamesBadge"><i class="fas fa-gamepad"></i> Loading 200+ Games...</span>
            </div>
        </div>

        <!-- HERO FEATURED GAME BANNER -->
        <div class="hero-banner" id="heroBanner">
            <div class="hero-content">
                <div class="hero-tag"><i class="fas fa-fire"></i> FEATURED UNBLOCKED GAME</div>
                <div class="hero-game-title" id="heroGameTitle">Bowmasters</div>
                <div class="hero-desc">Experience intense 2D archery battles with awesome physics and unique characters!</div>
                <a href="/pages/play.html?launch=%2Fstores%2Fgn-math%2F0.html" class="btn-play-hero" id="heroPlayBtn">
                    <i class="fas fa-play"></i> PLAY NOW
                </a>
            </div>
        </div>

        <!-- CONTROLS & FILTER BAR -->
        <div class="controls-bar">
            <div class="search-input-wrap">
                <i class="fas fa-search"></i>
                <input type="text" class="games-search-input" id="gameSearchInput" placeholder="Search 200+ unblocked games..." oninput="handleSearchInput()" />
            </div>

            <select class="provider-select" id="providerSelect" onchange="handleProviderChange()">
                <option value="all">🎮 All Game Libraries</option>
                <option value="gn-math">🧠 GN Math Games</option>
                <option value="ugs">⚡ UGS Library</option>
                <option value="truffled">🍬 Truffled Games</option>
                <option value="ngg">🚀 NowGG Games</option>
            </select>

            <div class="category-pills">
                <button class="pill-btn active" onclick="setCategoryFilter('all', this)"><i class="fas fa-grid-2"></i> All</button>
                <button class="pill-btn" onclick="setCategoryFilter('featured', this)"><i class="fas fa-fire"></i> Featured</button>
                <button class="pill-btn" onclick="setCategoryFilter('favorites', this)"><i class="fas fa-star"></i> Favorites</button>
                <button class="pill-btn" onclick="setCategoryFilter('recent', this)"><i class="fas fa-clock"></i> Recent</button>
            </div>
        </div>
    </header>

    <!-- ─── MAIN GAMES GRID ───────────────────────────── -->
    <main class="games-container" id="gamesContainer">
        <div class="loading-state">
            <i class="fas fa-spinner loading-spinner"></i>
            <div>Loading unblocked games library...</div>
        </div>
    </main>

    <!-- ─── SCRIPT LOGIC ───────────────────────────────── -->
    <script src="/assets/js/Cola.data.js"></script>
    <script>
        const FAVS_KEY = "Cola_favorites";
        const RECENT_KEY = "Cola_recent";
        const MAX_RECENT = 20;

        let allGamesData = [];
        let currentProvider = "all";
        let currentCategory = "all";
        let searchQuery = "";

        function getFavs() {
            try { return JSON.parse(localStorage.getItem(FAVS_KEY)) || []; } catch { return []; }
        }

        function saveFavs(favs) {
            localStorage.setItem(FAVS_KEY, JSON.stringify(favs));
        }

        function isFav(launchUrl) {
            return getFavs().includes(launchUrl);
        }

        function toggleFav(launchUrl, btnElement) {
            let favs = getFavs();
            const isCurrentlyFav = favs.includes(launchUrl);

            if (isCurrentlyFav) {
                favs = favs.filter(u => u !== launchUrl);
                btnElement.classList.remove("active");
                btnElement.innerHTML = '<i class="far fa-star"></i>';
            } else {
                favs.push(launchUrl);
                btnElement.classList.add("active");
                btnElement.innerHTML = '<i class="fas fa-star"></i>';
            }
            saveFavs(favs);

            if (currentCategory === "favorites") {
                renderGames();
            }
        }

        function getRecent() {
            try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
        }

        function recordRecent(launchUrl) {
            let recent = getRecent().filter(u => u !== launchUrl);
            recent.unshift(launchUrl);
            if (recent.length > MAX_RECENT) recent = recent.slice(0, MAX_RECENT);
            localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
        }

        // ── LOAD GAME DATA FROM JSON PROVIDERS ─────────────────
        async function fetchProviderJson(providerKey) {
            try {
                const res = await fetch(`/assets/json/${providerKey}.json?v=${Date.now()}`);
                if (!res.ok) return [];
                const json = await res.json();
                return json.map(g => ({
                    name: g.name || "Game",
                    img: g.img || "/assets/img/fav.png",
                    launch: g.url || g.launch || "",
                    provider: providerKey
                })).filter(g => g.launch && g.name && g.name !== "1");
            } catch (e) {
                return [];
            }
        }

        async function loadAllGames() {
            const [gnMath, truffled, ugs, ngg] = await Promise.all([
                fetchProviderJson("gn-math"),
                fetchProviderJson("truffled"),
                fetchProviderJson("ugs"),
                fetchProviderJson("ngg")
            ]);

            allGamesData = [...gnMath, ...truffled, ...ugs, ...ngg];

            // Set Featured Flag
            allGamesData.forEach((g, idx) => {
                if (idx % 8 === 0 || g.name.toLowerCase().includes("ovo") || g.name.toLowerCase().includes("bowmaster")) {
                    g.featured = true;
                }
            });

            document.getElementById("totalGamesBadge").innerHTML = `<i class="fas fa-gamepad"></i> ${allGamesData.length} Unblocked Games`;
            
            // Set Hero Game
            if (allGamesData.length > 0) {
                const hero = allGamesData.find(g => g.name.toLowerCase().includes("ovo")) || allGamesData[0];
                document.getElementById("heroGameTitle").textContent = hero.name;
                document.getElementById("heroPlayBtn").href = `/pages/play.html?launch=${encodeURIComponent(hero.launch)}`;
                if (hero.img && !hero.img.includes("placeholder")) {
                    document.getElementById("heroBanner").style.backgroundImage = `linear-gradient(135deg, rgba(245,158,11,0.25) 0%, rgba(9,9,11,0.92) 70%), url('${hero.img}')`;
                }
            }

            renderGames();
        }

        // ── RENDER GAMES GRID ───────────────────────────────
        function renderGames() {
            const container = document.getElementById("gamesContainer");
            container.innerHTML = "";

            let filtered = [...allGamesData];

            // Provider Filter
            if (currentProvider !== "all") {
                filtered = filtered.filter(g => g.provider === currentProvider);
            }

            // Category Filter
            if (currentCategory === "featured") {
                filtered = filtered.filter(g => g.featured);
            } else if (currentCategory === "favorites") {
                const favUrls = getFavs();
                filtered = filtered.filter(g => favUrls.includes(g.launch));
            } else if (currentCategory === "recent") {
                const recentUrls = getRecent();
                filtered = filtered.filter(g => recentUrls.includes(g.launch));
            }

            // Search Query Filter
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(g => g.name.toLowerCase().includes(q));
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-ghost" style="font-size: 36px; color: var(--accent-gold);"></i>
                        <div>No games found matching your search. Try adjusting filters!</div>
                    </div>
                `;
                return;
            }

            const grid = document.createElement("div");
            grid.className = "games-grid";

            filtered.forEach(game => {
                const card = document.createElement("a");
                card.className = "game-card obfuscate";
                card.href = `/pages/play.html?launch=${encodeURIComponent(game.launch)}`;
                card.onclick = () => recordRecent(game.launch);

                const favActive = isFav(game.launch) ? "active" : "";

                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${game.img}" loading="lazy" alt="${escapeAttr(game.name)}" onerror="this.src='/assets/img/fav.png'" />
                        <div class="card-play-overlay">
                            <span class="play-btn-pop"><i class="fas fa-play"></i> PLAY NOW</span>
                        </div>
                        <button class="card-fav-btn ${favActive}" title="Favorite" onclick="event.preventDefault(); event.stopPropagation(); toggleFav('${escapeAttr(game.launch)}', this)">
                            <i class="${favActive ? 'fas' : 'far'} fa-star"></i>
                        </button>
                    </div>
                    <div class="card-content">
                        <div class="card-title">${escapeHtml(game.name)}</div>
                        <div class="card-meta">
                            <span class="card-tag">${game.provider}</span>
                            <span>Unblocked</span>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        function handleSearchInput() {
            searchQuery = document.getElementById("gameSearchInput").value;
            renderGames();
        }

        function handleProviderChange() {
            currentProvider = document.getElementById("providerSelect").value;
            renderGames();
        }

        function setCategoryFilter(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll(".pill-btn").forEach(el => el.classList.remove("active"));
            btnElement.classList.add("active");
            renderGames();
        }

        function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
        function escapeAttr(s) { return String(s).replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

        // Theme sync
        document.getElementById("csslink").href = `/assets/css/colors/${localStorage.getItem("Cola_theme") ?? "default"}.css`;

        // Start loading
        loadAllGames();
    </script>

    <script src="/assets/js/Cola.ads.js"></script>
    <script src="/assets/js/cola.sidebar.js"></script>

</body>
</html>
